[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic"
version = "0.1.0"
description = "The start of an interperter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "jpamb",
  "tree-sitter>=0.26.0",
  "tree-sitter-java>=0.23.5",
]


[project.scripts]
dynamic-interpreter = "dynamic:interpret"
dynamic-analysis = "dynamic:analyse"
dynamic-dict-analysis = "dynamic_dict:analyse"

[tool.uv.sources]
jpamb = { path = "../../", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
